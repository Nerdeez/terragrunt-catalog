variables:
  - name: StateBucket
    description: |
      GCS bucket for remote state (phase 2). Leave empty for local state (phase 1 bootstrap).
      Provide the bucket name after creating it with the bootstrap project unit.
    type: string
    order: 7
    default: ''

dependencies:
  - name: config
    # Relative paths break when Terragrunt extracts only templates/root to a temp dir
    # (catalog/scaffold from git). Derive the config template URL from the same source.
    template-url: '{{ replace templateURL "templates/root" "templates/config/.boilerplate" }}'
    output-folder: .
