variables:
  - name: StateBucket
    description: |
      GCS bucket for remote state (phase 2). Leave empty for local state (phase 1 bootstrap).
      Provide the bucket name after creating it with the bootstrap project unit.
    type: string
    order: 7
    default: ''
    confirm: true

dependencies:
  - name: config
    # Fetched from git — Terragrunt extracts only templates/root to a temp dir when
    # scaffolding from catalog, so a relative ../config path is not available.
    template-url: 'git::https://github.com/Nerdeez/terragrunt-catalog.git//iac/gcp/catalog/templates/config/.boilerplate?ref={{ default "main" (index . "Ref") }}'
    output-folder: .
